name: iremehub+ frontend validation

on:
  push:
    branches: ["main", "rebuild/iremehub-plus", "fix/phase-3-ci-and-security"]
    paths:
      - "client/**"
      - ".github/workflows/iremehub-frontend.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "client/**"
      - ".github/workflows/iremehub-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build production frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
